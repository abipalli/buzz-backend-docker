name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig toolchain
        if: runner.os == 'Linux'
        run: pip install ziglang && cargo install --locked cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Package
        shell: bash
        run: |
          name="buzz-backend-docker-$GITHUB_REF_NAME-$TARGET.tar.gz"
          tar -C "target/$TARGET/release" -czf "$name" buzz-backend-docker
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: buzz-backend-docker-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Render formula
        run: scripts/render-formula.sh "${GITHUB_REF_NAME#v}" dist > buzz-backend-docker.rb
      - name: Push to abipalli/homebrew-tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:abipalli/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp buzz-backend-docker.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/buzz-backend-docker.rb
          git diff --cached --quiet || git commit -m "buzz-backend-docker $GITHUB_REF_NAME"
          git push

  verify:
    needs: tap
    runs-on: macos-14
    steps:
      - run: brew install abipalli/tap/buzz-backend-docker
      - run: brew test buzz-backend-docker
      - run: echo '{"op":"info"}' | buzz-backend-docker | grep '"protocol_version":1'
