name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Provider answers info
        run: cargo run --quiet --locked <<< '{"op":"info"}' | grep -q '"protocol_version":1'
        shell: bash
      - name: Formula renders
        shell: bash
        run: |
          mkdir -p fake && for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            echo "0000  buzz-backend-docker-v0.0.0-$t.tar.gz" > "fake/buzz-backend-docker-v0.0.0-$t.tar.gz.sha256"
          done
          scripts/render-formula.sh 0.0.0 fake | grep -q 'class BuzzBackendDocker < Formula'
